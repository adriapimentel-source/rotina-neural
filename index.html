<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rotina Neural de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07121a;--card:#0d2232;--card2:#13303f;--txt:#eef6fa;--mut:#8fbfd2;--line:#ffffff26;--teal:#3de6c8;--blue:#5ab4ff;--lime:#b2eb5b;--amber:#ffcc55;--red:#ff6b6b;--violet:#b48bff;--base:16px;--r:18px;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);background-image:radial-gradient(ellipse 60% 40% at 0% 0%,#3de6c815,transparent),radial-gradient(ellipse 50% 35% at 100% 80%,#5ab4ff10,transparent);color:var(--txt);font:var(--base)/1.6 'DM Sans',system-ui,sans-serif}
body.large{--base:18px}body.xlarge{--base:20px}
body.contrast{--bg:#000;--card:#111;--card2:#1a1a1a;--txt:#fff;--mut:#ddd;--line:#ffffff55;--teal:#00ffe0;--lime:#ccff00;background:#000}
body.reading{--bg:#faf5e9;--card:#fffdf5;--card2:#f5ebcf;--txt:#1a1208;--mut:#4a3a20;--line:#c8a860;--teal:#0a7a68;--blue:#1b5fa8;--lime:#476b0b;--amber:#8a5a00;--red:#b3261e;--violet:#6a3fc0;background:#faf5e9}
body.reading .btn.primary{color:#fff}
body.reduce *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
h1,h2,h3{font-family:'Syne',system-ui,sans-serif;line-height:1.15;margin:0}
.app{max-width:760px;margin:auto;padding:0 16px calc(90px + var(--safe-bottom)) 16px}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.top{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:10px 64px 10px 0;gap:8px;background:linear-gradient(to bottom,var(--bg) 60%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{font-family:'Syne',sans-serif;font-weight:900;font-size:.95rem;letter-spacing:.02em;color:var(--teal)}
.brand small{display:block;font:500 .7rem 'DM Sans';color:var(--mut);letter-spacing:0}
.xp-badge{background:linear-gradient(135deg,var(--amber),#ff9f43);color:#2a1700;font-weight:800;font-size:.8rem;padding:4px 12px;border-radius:99px}
.a11y-fab{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:220;width:48px;height:48px;border:2px solid var(--teal);border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--blue));color:#04151e;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 26px #00000055}
.a11y-fab svg{width:24px;height:24px}
.prog-wrap{display:none;margin:0 0 18px}.prog-wrap.on{display:block}
.prog-row{display:flex;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--mut);margin-bottom:6px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--lime));transition:width .4s}
.phase-header{margin:8px 0 18px}
.ph-tag{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:.78rem;font-weight:700}
.tag-ato,.tag-fase{padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.tag-ato.a1{background:#3de6c81f;color:var(--teal)}.tag-ato.a2{background:#b48bff22;color:var(--violet)}.tag-ato.a3{background:#ffcc5522;color:var(--amber)}
body.reading .tag-ato{background:transparent}
.phase-header h1{font-size:clamp(1.7rem,6vw,2.3rem);margin-bottom:8px}
.phase-header p{color:var(--mut);margin:0;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h2{font-size:1.15rem;margin-bottom:8px}.card h3{font-size:1rem;margin:14px 0 6px}
.card p{margin:.4em 0}.mut{color:var(--mut)}.small{font-size:.85rem}
.lab{display:block;font-weight:700;margin:14px 0 6px}.lab:first-child{margin-top:0}
.hint{font-size:.85rem;color:var(--mut);margin:-2px 0 8px}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=datetime-local],select,textarea{width:100%;font:inherit;color:var(--txt);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 13px;min-height:46px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:none}
.wc{font-size:.78rem;color:var(--mut);text-align:right}.wc.ok{color:var(--lime)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 auto}
.row.nofill>*{flex:0 0 auto}
.btn{font:700 .95rem 'DM Sans',sans-serif;padding:12px 18px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--txt);cursor:pointer;min-height:46px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:linear-gradient(135deg,var(--teal),var(--blue));color:#04151e;border-color:transparent}
.btn.good{background:linear-gradient(135deg,var(--lime),var(--teal));color:#04151e;border-color:transparent}
.btn.ghost{background:transparent}.btn.sm{padding:7px 12px;min-height:38px;font-size:.85rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin:22px 0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opts.tight{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{display:block;text-align:left;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:48px}
.opt b{display:block}.opt small{color:var(--mut);display:block;font-size:.8rem}
.opt.on{border-color:var(--teal);background:#3de6c814}
.opt:hover{border-color:var(--blue)}
.callout{border-radius:14px;padding:12px 14px;margin:12px 0;border:1px solid var(--line);background:var(--card2)}
.callout.warn{border-color:var(--amber);background:#ffcc5514}.callout.bad{border-color:var(--red);background:#ff6b6b14}.callout.ok{border-color:var(--lime);background:#b2eb5b12}.callout.info{border-color:var(--blue);background:#5ab4ff12}
.callout b:first-child{display:block}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:5px 6px 5px 12px;font-size:.88rem}
.tag button{border:0;background:#ffffff1a;color:inherit;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:.8rem}
.sug{font:inherit;font-size:.85rem;background:transparent;color:var(--txt);border:1px dashed var(--mut);border-radius:99px;padding:5px 12px;cursor:pointer;min-height:34px}
.sug:hover{border-color:var(--teal);color:var(--teal)}
.scale{display:flex;gap:6px;margin-top:6px}
.scale button{flex:1;font:inherit;font-size:.8rem;background:var(--bg);color:var(--txt);border:2px solid var(--line);border-radius:10px;padding:8px 2px;cursor:pointer;min-height:44px}
.scale button.on{background:var(--teal);color:#04151e;border-color:var(--teal);font-weight:800}
.scale.dp button.on.s1{background:var(--lime)}.scale.dp button.on.s2{background:var(--amber)}.scale.dp button.on.s3{background:var(--red)}
.obst{padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--bg)}
.obst b{font-size:1rem}
.energy-num{font:900 clamp(3.4rem,16vw,6rem)/1 'Syne',sans-serif;color:var(--teal);text-align:center;display:block}
input[type=range]{width:100%;accent-color:var(--teal);min-height:36px}
.fer{border:1px solid var(--line);border-radius:16px;margin-bottom:12px;background:var(--bg);overflow:hidden}
.fer>summary{cursor:pointer;padding:14px 16px;font-weight:800;list-style:none;display:flex;gap:10px;align-items:center;justify-content:space-between}
.fer>summary::-webkit-details-marker{display:none}
.fer .in{padding:0 16px 16px}
.fer.on{border-color:var(--teal)}
.q{padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;background:var(--bg)}
.q.ok{border-color:var(--lime)}.q.no{border-color:var(--red)}
.q .opt{margin-top:8px}
.q .opt.right{border-color:var(--lime);background:#b2eb5b18}.q .opt.wrong{border-color:var(--red);background:#ff6b6b18}
.rrow{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.rrow:last-child{border:0}
.rr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:800}
.badge.crit{background:var(--red);color:#2a0606}.badge.aten{background:var(--amber);color:#2a1700}.badge.manu{background:var(--lime);color:#14260a}
.cm{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:6px;margin-bottom:6px;align-items:center}
details.dayd{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
details.dayd>summary{cursor:pointer;padding:11px 14px;font-weight:700;display:flex;justify-content:space-between}
details.dayd .in{padding:0 14px 12px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;margin:10px 0}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.72rem;color:var(--mut)}
.bars i{display:block;width:100%;background:linear-gradient(to top,var(--teal),var(--blue));border-radius:6px 6px 0 0;min-height:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font:800 1.5rem 'Syne',sans-serif;color:var(--teal)}.stat span{font-size:.78rem;color:var(--mut)}
.pal-wrap{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pal{font:inherit;font-size:.8rem;font-weight:700;color:var(--txt);background:var(--bg);border:2px solid var(--c,var(--line));border-radius:10px;padding:6px 10px;cursor:pointer;min-height:38px}
.pal.on{background:var(--c,var(--teal));color:#07121a}
.gridw{overflow:auto;border:1px solid var(--line);border-radius:14px;max-height:70vh;background:var(--card)}
table.sched{border-collapse:separate;border-spacing:0;min-width:640px;width:100%;font-size:.7rem}
table.sched th{position:sticky;top:0;z-index:2;background:var(--card2);padding:6px 2px;font-size:.78rem}
table.sched tbody th{position:sticky;left:0;top:auto;z-index:1;width:46px;text-align:right;padding:0 6px;color:var(--mut);font-weight:500;background:var(--card);vertical-align:top}
table.sched td{height:24px;border-top:1px solid #ffffff0d;border-left:1px solid #ffffff0d;padding:0 3px;text-align:center;overflow:hidden;white-space:nowrap;cursor:pointer;font-weight:700;color:#07121a}
table.sched td.free{color:var(--mut);background:transparent}
table.sched td.free:hover{background:#3de6c822}
table.sched td.fixed{background:repeating-linear-gradient(135deg,#ffffff10 0 6px,#ffffff06 6px 12px);color:var(--mut);cursor:default;font-weight:500}
table.sched td.off{background:#b48bff18;cursor:default;color:var(--violet);font-weight:500}
.day{border-bottom:1px solid var(--line);padding:10px 0}.day:last-child{border:0}
.day h3{display:flex;justify-content:space-between}
.sess{display:flex;gap:10px;align-items:baseline;padding:4px 0}
.sess i{display:inline-block;width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.sess time{font-variant-numeric:tabular-nums;color:var(--mut);min-width:110px;font-size:.88rem}
.sem{display:grid;gap:6px;margin:12px 0}
.sem div{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.ck:last-child{border:0}
.cc{border:1px solid var(--line);border-left:6px solid var(--violet);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--bg);break-inside:avoid}
.cc h3{margin-top:0}.cc ul{margin:6px 0 10px;padding-left:20px}.cc li{margin:3px 0}
.traf{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.traf>div{border-radius:14px;padding:12px;border:2px solid var(--line)}
.traf .g{border-color:var(--lime)}.traf .y{border-color:var(--amber)}.traf .r{border-color:var(--red)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:300;padding:16px}.modal.open{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-bottom));transform:translate(-50%,30px);background:var(--card2);border:1px solid var(--teal);color:var(--txt);padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:400;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:500;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
.hero{padding:26px 0 8px}
.hero h1{font-size:clamp(2.2rem,9vw,3.4rem)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:.82rem;background:var(--card)}
details.imp summary{cursor:pointer;color:var(--mut);font-size:.9rem}
.rep h2{margin:22px 0 10px}
@media(max-width:560px){.cm{grid-template-columns:1fr 1fr auto}.cm select{grid-column:1/-1}.rr2{grid-template-columns:1fr}}
@media print{body{background:#fff!important;color:#000!important}.top,.prog-wrap,.nav,.noprint,.a11y-fab,.toast{display:none!important}.card,.cc,.stat{background:#fff!important;border:1px solid #bbb!important;color:#000!important}.mut,.hint{color:#444!important}.app{max-width:none;padding:0}.gridw{max-height:none;overflow:visible}.cc{break-inside:avoid}*{color:#000!important}.badge{border:1px solid #000}}
h1:focus{outline:none}
[hidden]{display:none!important}

.cm>*,.rr2>*{min-width:0}
/* calendário */
.cal{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--bg);margin-bottom:12px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.cal-h b{text-transform:capitalize;font-family:'Syne',sans-serif}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-g .dw{font-size:.75rem;color:var(--mut);text-align:center;padding:4px 0;font-weight:700}
.cal-g button{min-height:44px;border-radius:10px;border:2px solid transparent;background:var(--card2);color:var(--txt);font:inherit;cursor:pointer;padding:0}
.cal-g button:hover:not(:disabled){border-color:var(--blue)}
.cal-g button:disabled{opacity:.28;cursor:not-allowed}
.cal-g button.today{border-color:var(--amber)}
.cal-g button.btw{background:#3de6c824}
.cal-g button.s1{background:var(--teal);color:#04151e;font-weight:800}
.cal-g button.s2{background:var(--violet);color:#120a2a;font-weight:800}
.badge.dia{background:#5ab4ff26;color:var(--blue);border:1px solid var(--blue);font-weight:700}
/* ilustrações */
.ilu{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin:12px 0}
.ilu svg{width:100%;height:auto;display:block}
.ilu text{fill:var(--txt);font-family:'DM Sans',system-ui,sans-serif}.ilu text.m{fill:var(--mut)}
.cena{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px}
.cena>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.cena span{font-size:1.7rem;display:block;line-height:1.2}.cena p{margin:6px 0 0;font-size:.9rem}
.ad{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.ad>div{border-radius:14px;padding:12px;border:2px solid var(--line)}
.ad .antes{border-color:var(--red);background:#ff6b6b10}.ad .depois{border-color:var(--lime);background:#b2eb5b10}
.ad p{margin:6px 0 0;font-size:.9rem}
/* radar */
.exp2{display:grid;gap:14px}
.ex{display:flex;gap:12px;align-items:flex-start}
.ex p{margin:4px 0}
.exn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--blue));color:#04151e;font:800 1.1rem 'Syne',sans-serif;display:flex;align-items:center;justify-content:center}
table.matriz{border-collapse:separate;border-spacing:4px;width:100%;min-width:300px;text-align:center;font-size:.85rem}
table.matriz th{font-size:.78rem;color:var(--mut);padding:4px}
table.matriz td{border-radius:10px;padding:8px 4px}table.matriz td b{display:block;font-size:1.25rem}table.matriz td small{font-size:.7rem}
table.matriz td.crit{background:#ff6b6b33;color:var(--txt)}table.matriz td.aten{background:#ffcc5533}table.matriz td.manu{background:#b2eb5b2e}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.pcard.ok{border-color:#3de6c866}
.pcard .ph{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:1.1rem}
.pq{margin-bottom:12px}
.pt{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.pt .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem}
.pt b{display:block;font-size:1rem}.pt small{color:var(--mut);display:block;font-size:.82rem}
.pb3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font:inherit;color:var(--txt);background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 4px;cursor:pointer;min-height:92px}
.pbtn .e{font-size:1.5rem;line-height:1.1}.pbtn b{font-size:.98rem}.pbtn small{font-size:.72rem;color:var(--mut);line-height:1.25}
.pbtn:hover{border-color:var(--blue)}
.pbtn.on{color:#07121a;font-weight:700}.pbtn.on small{color:#07121a}
.pbtn.d1{background:var(--lime);border-color:var(--lime)}.pbtn.d2{background:var(--amber);border-color:var(--amber)}.pbtn.d3{background:var(--red);border-color:var(--red)}
.pbtn.w1,.pbtn.w2,.pbtn.w3{background:var(--blue);border-color:var(--blue)}
.pres{padding-top:10px;border-top:1px dashed var(--line);font-size:.95rem}
.pres .badge{margin-left:6px}
@media(max-width:560px){.ad{grid-template-columns:1fr}.pbtn small{font-size:.68rem}}

.fer .tg::after{content:'abrir'}.fer[open] .tg::after{content:'fechar'}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Rotina Neural<small>Edição universal</small></div>
    <span class="xp-badge" id="xp" aria-live="polite">⚡ 0 XP</span>
  </header>
  <div class="prog-wrap" id="progw"><div class="prog-row"><span id="progl"></span><span id="progt"></span></div><div class="bar"><i id="bar"></i></div></div>
  <main id="stage"></main>
</div>
<button class="a11y-fab noprint" onclick="openA()" aria-label="Abrir opções de acessibilidade" title="Acessibilidade">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2"/><path d="M4 8.5l8 1.5 8-1.5M12 10v5m0 0l-3.5 6M12 15l3.5 6"/></svg>
</button>
<div class="modal" id="am" role="dialog" aria-modal="true" aria-labelledby="amt" onclick="if(event.target===this)closeA()">
  <div class="box">
    <h2 id="amt" style="margin-bottom:12px">Acessibilidade</h2>
    <label class="lab" for="fs">Tamanho da fonte</label>
    <select id="fs" onchange="applyA()"><option value="">Padrão (16px)</option><option value="large">Grande (18px)</option><option value="xlarge">Muito grande (20px)</option></select>
    <label class="lab" for="vm">Tema visual</label>
    <select id="vm" onchange="applyA()"><option value="">Padrão (escuro)</option><option value="contrast">Alto contraste</option><option value="reading">Modo leitura (claro)</option></select>
    <label class="row nofill" style="margin-top:14px;gap:8px"><input type="checkbox" id="rm" onchange="applyA()"> Reduzir animações</label>
    <button class="btn primary" style="margin-top:16px;width:100%" onclick="closeA()">Fechar</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:20px">Este jogo precisa de JavaScript para funcionar.</p></noscript>
